<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jean Design AI | Prompt Builder Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="https://via.placeholder.com/32/DC143C/FFFFFF?text=J" type="image/x-icon">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="brand">
                <div class="logo-circle">
                    <span class="logo-inner">J</span>
                </div>
                <div class="brand-text">
                    <span class="brand-name">Jean Design</span>
                    <span class="brand-tag">AI APP</span>
                </div>
            </div>

            <div class="nav-links">
                <button class="nav-btn active" data-view="prompt">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Constructor
                </button>
                <button class="nav-btn" data-view="sounds">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5zM19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    Sonidos
                </button>
                <button class="nav-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
                    Resultados
                </button>
                <button class="nav-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Configuración
                </button>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="dot pulse"></span>
                    <span id="status-text">Gemini 1.5 Flash Conectado</span>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="content-area">
            <header class="top-banner">
                <div class="banner-badge">AI Creative Studio</div>
                <h1 class="main-title">Prompt Builder <span class="accent">Pro</span></h1>
            </header>

            <div class="grid-layout">
                <!-- Left Column: Settings -->
                <section class="settings-panel glass-card">
                    <h2 class="section-title">Configurar Prompt</h2>
                    
                    <div class="input-group">
                        <label>Tipo de Contenido</label>
                        <div class="segmented-control">
                            <button class="sc-btn active" data-type="video">IA Video</button>
                            <button class="sc-btn" data-type="image">IA Imagen</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label>Modelo de Inteligencia</label>
                        <select id="model-select" class="styled-select">
                            <option value="Gemini Ultra 1.5 Pro">Gemini Ultra 1.5 Pro</option>
                            <option value="Gemini Flash 1.5" selected>Gemini Flash 1.5</option>
                            <option value="Vertex AI Pro">Vertex AI Pro</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label>Estilo Visual</label>
                        <div class="grid-toggles">
                            <button class="toggle-btn active" data-style="Cinemático">Cinemático</button>
                            <button class="toggle-btn" data-style="Cyberpunk">Cyberpunk</button>
                            <button class="toggle-btn" data-style="Anime">Anime</button>
                            <button class="toggle-btn" data-style="Fotorrealista">Fotorrealista</button>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label>Intensidad</label>
                            <span id="intensity-val" class="val-badge">0.8</span>
                        </div>
                        <input type="range" id="intensity-slider" min="0" max="1" step="0.1" value="0.8">
                    </div>

                    <div class="input-group">
                        <label>Referencia Visual (Opcional)</label>
                        <div class="drop-zone">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#DC143C" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5-5 5 5M12 5v12"/></svg>
                            <span>Arrastra tu imagen</span>
                        </div>
                    </div>
                </section>

                <!-- Right Column: Input/Output -->
                <!-- VISTA A: CONSTRUCTOR PROMPTS -->
                <section id="view-prompt" class="prompt-workspace active">
                    <div class="input-card glass-card">
                        <label class="section-title">Tu Descripción (Español)</label>
                        <textarea id="prompt-input" placeholder="Escribe aquí tu visión... ej: Un caballero futurista bajo neones rojos de Tokio..."></textarea>
                    </div>

                    <div class="output-card glass-card">
                        <div class="output-header">
                            <h2 class="section-title">Instrucciones Prompt (JSON)</h2>
                            <div class="header-actions">
                                <div id="loader" class="loader-circle hidden"></div>
                                <button id="copy-btn" class="mini-btn">Copiar</button>
                            </div>
                        </div>
                        <div class="code-container">
                            <pre id="output-json" class="language-json">Esperando prompt...</pre>
                        </div>
                    </div>
                </section>

                <!-- VISTA B: CONSOLA DE SONIDOS (NUEVO) -->
                <section id="view-sounds" class="sound-workspace hidden">
                    <h2 class="section-title">Consola de Sonidos</h2>
                    <div class="sound-visualizer">
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                        <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                    </div>
                    <div class="sound-grid">
                        <div class="sound-card glass-card">
                            <div class="card-head">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC143C" stroke-width="2"><path d="M11 5L6 9H2v6h4l5 4V5z"/></svg>
                                <h3>Reverberación</h3>
                            </div>
                            <div class="knob"></div>
                            <label class="switch"><input type="checkbox" checked><span class="slider round"></span></label>
                        </div>
                        <div class="sound-card glass-card">
                            <div class="card-head">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC143C" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                                <h3>Distorsión</h3>
                            </div>
                            <div class="knob off"></div>
                            <label class="switch"><input type="checkbox"><span class="slider round"></span></label>
                        </div>
                        <div class="sound-card glass-card">
                            <div class="card-head">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#DC143C" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                <h3>Eco Espacial</h3>
                            </div>
                            <div class="knob pulse"></div>
                            <label class="switch"><input type="checkbox" checked><span class="slider round"></span></label>
                        </div>
                    </div>
                </section>
            </div>

            <footer class="bottom-actions">
                <button id="generate-btn" class="primary-btn">
                    <span class="btn-text">GENERAR</span>
                    <div class="btn-glow"></div>
                </button>
            </footer>
        </main>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">¡Copiado al portapapeles!</div>

    <script src="script.js"></script>
</body>
</html>
